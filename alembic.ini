# Alembic configuration (spec S3-R5). Run from the repository root:
#   $env:PYTHONPATH="src"; $env:FLOWSCORE_DATABASE_URL="..."; alembic upgrade head
# The database URL is NOT here: alembic/env.py reads it from FLOWSCORE_DATABASE_URL only (S3-R4).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
